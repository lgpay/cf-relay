name = "cf-relay"
main = "src/index.js"
compatibility_date = "2026-09-18"

# 部署到 workers.dev 子域（首次部署会自动创建）
workers_dev = true

# 需要自定义域名时，解开下面注释并改成你的域名（需该域托管在 Cloudflare）
# routes = [
#   { pattern = "dl.example.com", custom_domain = true }
# ]

# ---------- 可选环境变量：不配即用默认宽松策略 ----------
# 生产环境强烈建议至少配 TOKEN 或 ALLOW_HOSTS，避免被当成免费公开代理白嫖

[vars]
# TOKEN = "change-me"
# ALLOW_HOSTS = "github.com,*.githubusercontent.com,*.github.com"
# DENY_HOSTS = ""
# ALLOW_PRIVATE = "0"
# UA = ""
# REFERER = ""
# UPSTREAM_HEADERS = "{}"
# CACHE_TTL = "0"
# MAX_BYTES = "0"
