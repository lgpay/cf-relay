# 仓库根的这一份配置，是为了让「Root directory 留空（= 仓库根）」也能正确部署。
# 它与 worker/wrangler.toml 指向同一个入口，两者等效 —— 改环境变量时记得同步。
#
# Cloudflare 上二选一即可：
#   A. Root directory 填 worker  → 用 worker/wrangler.toml
#   B. Root directory 留空       → 用这一份
#
# 为什么要有它：Root directory 若指向一个没有 wrangler 配置的目录，Workers Builds
# 会退回「自动配置」，把仓库当成静态站点发布。症状是访客无论带什么参数都只看到
# 首页 HTML（因为静态站点不认 ?url=），且未命中路径返回空的 404。

name = "cf-relay"
main = "worker/src/index.js"
compatibility_date = "2026-09-18"

# 部署到 workers.dev 子域（首次部署会自动创建）
workers_dev = true

# 需要自定义域名时，解开注释并改成你的域名（需该域托管在 Cloudflare）
# routes = [
#   { pattern = "dl.example.com", custom_domain = true }
# ]

# ---------- 可选环境变量：不配即用默认宽松策略 ----------
# 生产环境强烈建议至少配 TOKEN 或 ALLOW_HOSTS，避免被当成免费公开代理白嫖

[vars]
# TOKEN = "change-me"
# ALLOW_HOSTS = "github.com,*.githubusercontent.com,*.github.com"
# DENY_HOSTS = ""
# ALLOW_PRIVATE = "0"
# UA = ""
# REFERER = ""
# UPSTREAM_HEADERS = "{}"
# CACHE_TTL = "0"
# MAX_BYTES = "0"
